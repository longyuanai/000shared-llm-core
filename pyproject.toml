[tool.poetry]
name = "shared-llm-core"
version = "0.1.0"
description = "OpenAI-compatible LLM Gateway for longyuanai AI Security Agent suite"
authors = ["longyuanai"]
license = "MIT"
readme = "README.md"
packages = [{ include = "shared_llm_core", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.27.0"
pydantic = "^2.7.0"
pyyaml = "^6.0.1"
tenacity = "^8.3.0"
structlog = "^24.2.0"
python-dotenv = "^1.0.1"
# 0.115.x constrains Starlette below the releases that fix the 2026
# multipart/range advisories. Keep the minor line explicit so dependency
# audits cannot silently resolve back to the vulnerable 0.46.x series.
fastapi = ">=0.139.2,<0.140.0"
uvicorn = "^0.30.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"
pytest-mock = "^3.14.0"
ruff = "^0.5.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
markers = [
    "integration: cross-repository or live-process integration tests",
]

name: inspect-worker-return

on:
  pull_request:
    paths:
      - "001AI-SOC-Agent/**"
      - "002AI-Vulnerability-Agent/**"
      - "003AI Agent安全靶场/**"
      - "004AI代码审计/**"
      - "005AI逆向Agent/**"
      - "006AI-Firmware-Security-Agent/**"
      - "scripts/inspect_worker_return.py"
      - ".github/workflows/inspect.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out suite
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project dependencies
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          & $py -m pip install --disable-pip-version-check pytest pytest-mock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $projects = @(
            "000shared-llm-core",
            "001AI-SOC-Agent",
            "002AI-Vulnerability-Agent",
            "003AI Agent安全靶场",
            "004AI代码审计/004AI-CodeGuard-upgrade",
            "005AI逆向Agent",
            "006AI-Firmware-Security-Agent"
          )
          foreach ($project in $projects) {
            & $py -m pip install --disable-pip-version-check -e $project
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run pytest (001 AI SOC Agent)
        shell: pwsh
        working-directory: 001AI-SOC-Agent
        env:
          PYTHONPATH: ${{ github.workspace }}/001AI-SOC-Agent/src
        run: |
          $py = (Get-Command python).Source
          & $py -m pytest tests/ `
            --basetemp=C:/pytest-tmp/001/ `
            -o addopts= `
            -q --tb=no
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run pytest (002 AI Vulnerability Agent)
        shell: pwsh
        working-directory: 002AI-Vulnerability-Agent
        env:
          PYTHONPATH: ${{ github.workspace }}/002AI-Vulnerability-Agent/src
        run: |
          $py = (Get-Command python).Source
          & $py -m pytest tests/ `
            --basetemp=C:/pytest-tmp/002/ `
            -o addopts= `
            -q --tb=no
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run pytest (003 AI Agent Security Lab)
        shell: pwsh
        working-directory: 003AI Agent安全靶场
        env:
          PYTHONPATH: ${{ github.workspace }}/003AI Agent安全靶场/src
        run: |
          $py = (Get-Command python).Source
          & $py -m pytest tests/ `
            --basetemp=C:/pytest-tmp/003/ `
            -o addopts= `
            -q --tb=no
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run pytest (004 AI CodeGuard)
        shell: pwsh
        working-directory: 004AI代码审计/004AI-CodeGuard-upgrade
        env:
          PYTHONPATH: ${{ github.workspace }}/004AI代码审计/004AI-CodeGuard-upgrade/src;${{ github.workspace }}/004AI代码审计/004AI-CodeGuard-upgrade/.python-deps
        run: |
          $py = (Get-Command python).Source
          & $py -m pytest tests/ `
            --basetemp=C:/pytest-tmp/004/ `
            -o addopts= `
            -q --tb=no
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run pytest (005 AI Reverse Agent)
        shell: pwsh
        working-directory: 005AI逆向Agent
        env:
          PYTHONPATH: ${{ github.workspace }}/005AI逆向Agent/src
        run: |
          $py = (Get-Command python).Source
          & $py -m pytest tests/ `
            --basetemp=C:/pytest-tmp/005/ `
            -o addopts= `
            -q --tb=no
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run pytest (006 AI Firmware Security Agent)
        shell: pwsh
        working-directory: 006AI-Firmware-Security-Agent
        env:
          PYTHONPATH: ${{ github.workspace }}/006AI-Firmware-Security-Agent/src
        run: |
          $py = (Get-Command python).Source
          & $py -m pytest tests/ `
            --basetemp=C:/pytest-tmp/006/ `
            -o addopts= `
            -q --tb=no
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show pytest basetemp
        shell: pwsh
        run: Get-ChildItem -LiteralPath C:/pytest-tmp/ -Force

      - name: Run inspect (6 workers)
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          $adapter = @'
          import importlib.util
          import os
          import sys
          from pathlib import Path

          script = Path(os.environ["GITHUB_WORKSPACE"]) / "scripts" / "inspect_worker_return.py"
          spec = importlib.util.spec_from_file_location("inspect_worker_return", script)
          if spec is None or spec.loader is None:
              raise RuntimeError(f"cannot load {script}")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.ROOT = Path(os.environ["GITHUB_WORKSPACE"])
          module.PY = sys.executable
          raise SystemExit(module.main())
          '@
          $resultFile = Join-Path $env:RUNNER_TEMP "inspect-worker-return.txt"
          & $py -c $adapter 2>&1 | Tee-Object -FilePath $resultFile
          $inspectExit = $LASTEXITCODE

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## Six-worker inspection"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```text'
          Get-Content -LiteralPath $resultFile |
            Select-Object -Last 12 |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```'

          exit $inspectExit

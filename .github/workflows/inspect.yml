name: suite-ci

on:
  workflow_dispatch:
  repository_dispatch:
    types: [suite-ci]
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

concurrency:
  group: suite-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-suite:
    name: Test nine-repository suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUITE_DIR: ${{ github.workspace }}/suite
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out shared core
        uses: actions/checkout@v7
        with:
          path: suite/000shared-llm-core

      - name: Resolve locked repository refs
        id: suite_refs
        shell: bash
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re

          suite = pathlib.Path(os.environ["SUITE_DIR"])
          lock = json.loads((suite / "000shared-llm-core" / "suite-lock.yml").read_text())
          payload = json.loads(os.environ.get("CLIENT_PAYLOAD") or "null") or {}
          if not isinstance(payload, dict):
              raise SystemExit("client payload must be an object")
          mappings = {
              "integration": ("integration_ref", "integration_sha"),
              "soc": ("soc_ref", "soc_sha"),
              "vulnerability": ("vulnerability_ref", "vulnerability_sha"),
              "lab": ("lab_ref", "lab_sha"),
              "code": ("code_ref", "code_sha"),
              "reverse": ("reverse_ref", "reverse_sha"),
              "firmware": ("firmware_ref", "firmware_sha"),
              "web_ui": ("web_ui_ref", "web_ui_sha"),
          }
          entries = {entry["key"]: entry for entry in lock["repositories"]}
          errors = []
          resolved = {}
          for key, (env_name, payload_name) in mappings.items():
              if key not in entries:
                  errors.append(f"suite lock is missing {key}")
                  continue
              value = payload.get(payload_name) or entries[key]["commit"]
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value):
                  errors.append(f"{key}: ref must be a full lowercase commit SHA")
                  continue
              resolved[env_name] = value
          if errors:
              raise SystemExit("\n".join(errors))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              for output_name, value in resolved.items():
                  output_file.write(f"{output_name}={value}\n")
          print(f"Resolved {len(resolved)} refs from suite-lock.yml/payload")
          PY

      - name: Check out integration gateway
        uses: actions/checkout@v7
        with:
          repository: longyuanai/-000shared-integration
          ref: ${{ steps.suite_refs.outputs.integration_ref }}
          path: suite/000shared-integration
          token: ${{ secrets.SUITE_READ_TOKEN || github.token }}

      - name: Check out 001 SOC Agent
        uses: actions/checkout@v7
        with:
          repository: longyuanai/-001AI-SOC-Agent
          ref: ${{ steps.suite_refs.outputs.soc_ref }}
          path: suite/001AI-SOC-Agent
          token: ${{ secrets.SUITE_READ_TOKEN || github.token }}

      - name: Check out 002 Vulnerability Agent
        uses: actions/checkout@v7
        with:
          repository: longyuanai/002AI-Vulnerability-Agent
          ref: ${{ steps.suite_refs.outputs.vulnerability_ref }}
          path: suite/002AI-Vulnerability-Agent
          token: ${{ secrets.SUITE_READ_TOKEN || github.token }}

      - name: Check out 003 Agent Security Lab
        uses: actions/checkout@v7
        with:
          repository: longyuanai/003AI-Agent-Security-Lab
          ref: ${{ steps.suite_refs.outputs.lab_ref }}
          path: "suite/003AI Agent安全靶场"
          token: ${{ secrets.SUITE_READ_TOKEN || github.token }}

      - name: Check out 004 Code Audit
        uses: actions/checkout@v7
        with:
          repository: longyuanai/004AI-Code-Audit
          ref: ${{ steps.suite_refs.outputs.code_ref }}
          path: suite/004AI-Code-Audit
          token: ${{ secrets.SUITE_READ_TOKEN || github.token }}

      - name: Check out 005 Reverse Agent
        uses: actions/checkout@v7
        with:
          repository: longyuanai/005AI-Reverse-Agent
          ref: ${{ steps.suite_refs.outputs.reverse_ref }}
          path: suite/005AI-Reverse-Agent
          token: ${{ secrets.SUITE_READ_TOKEN || github.token }}

      - name: Check out 006 Firmware Security Agent
        uses: actions/checkout@v7
        with:
          repository: longyuanai/006AI-Firmware-Security-Agent
          ref: ${{ steps.suite_refs.outputs.firmware_ref }}
          path: suite/006AI-Firmware-Security-Agent
          token: ${{ secrets.SUITE_READ_TOKEN || github.token }}

      - name: Check out web UI
        uses: actions/checkout@v7
        with:
          repository: longyuanai/web-ui
          ref: ${{ steps.suite_refs.outputs.web_ui_ref }}
          path: suite/web-ui
          token: ${{ secrets.SUITE_READ_TOKEN || github.token }}

      - name: Verify locked repository set
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INTEGRATION_REF: ${{ steps.suite_refs.outputs.integration_ref }}
          SOC_REF: ${{ steps.suite_refs.outputs.soc_ref }}
          VULNERABILITY_REF: ${{ steps.suite_refs.outputs.vulnerability_ref }}
          LAB_REF: ${{ steps.suite_refs.outputs.lab_ref }}
          CODE_REF: ${{ steps.suite_refs.outputs.code_ref }}
          REVERSE_REF: ${{ steps.suite_refs.outputs.reverse_ref }}
          FIRMWARE_REF: ${{ steps.suite_refs.outputs.firmware_ref }}
          WEB_UI_REF: ${{ steps.suite_refs.outputs.web_ui_ref }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          suite = pathlib.Path(os.environ["SUITE_DIR"])
          lock = json.loads((suite / "000shared-llm-core" / "suite-lock.yml").read_text())
          refs = {
              "integration": os.environ["INTEGRATION_REF"],
              "soc": os.environ["SOC_REF"],
              "vulnerability": os.environ["VULNERABILITY_REF"],
              "lab": os.environ["LAB_REF"],
              "code": os.environ["CODE_REF"],
              "reverse": os.environ["REVERSE_REF"],
              "firmware": os.environ["FIRMWARE_REF"],
              "web_ui": os.environ["WEB_UI_REF"],
          }
          errors = []
          for entry in lock["repositories"]:
              key = entry["key"]
              path = suite / entry["path"]
              actual = subprocess.check_output(
                  ["git", "-C", str(path), "rev-parse", "HEAD"], text=True
              ).strip()
              expected = os.environ["GITHUB_SHA"] if key == "core" else refs[key]
              if actual != expected:
                  errors.append(f"{key}: checked out {actual}, expected {expected}")
              if key == "core" and entry["commit"] != "self":
                  errors.append("core: suite lock must use the workflow SHA")
              if (
                  key != "core"
                  and expected != entry["commit"]
                  and os.environ["EVENT_NAME"] != "repository_dispatch"
              ):
                  errors.append(f"{key}: unlocked ref outside repository_dispatch")
          if errors:
              raise SystemExit("\n".join(errors))
          print(f"Verified {len(lock['repositories'])} repositories")
          PY

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: suite/**/pyproject.toml

      - name: Install all projects
        shell: bash
        run: |
          set -euo pipefail
          # 000shared-llm-core is deliberately NOT listed here. All seven
          # products declare it as a Poetry path dependency, which poetry-core
          # emits as a direct file:// reference. Requesting it here as well
          # makes pip see the same package as both an editable and a
          # non-editable direct reference and abort with ResolutionImpossible.
          # Installing only the products pulls core in exactly once, via those
          # path dependencies.
          python -m pip install \
            -e "$SUITE_DIR/000shared-integration" \
            -e "$SUITE_DIR/001AI-SOC-Agent" \
            -e "$SUITE_DIR/002AI-Vulnerability-Agent" \
            -e "$SUITE_DIR/003AI Agent安全靶场" \
            -e "$SUITE_DIR/004AI-Code-Audit" \
            -e "$SUITE_DIR/005AI-Reverse-Agent" \
            -e "$SUITE_DIR/006AI-Firmware-Security-Agent"

      - name: Install test tooling
        shell: bash
        run: |
          set -euo pipefail
          # `pip install -e` ignores Poetry's dev dependency group, so nothing
          # above installs a test runner. Union of the [tool.poetry.group.dev]
          # entries that the pytest step actually imports, across all eight
          # Python repositories. Lint/type tools (ruff, mypy, types-pyyaml) are
          # deliberately excluded — no test imports them.
          python -m pip install \
            "pytest>=8.2" \
            pytest-asyncio \
            pytest-mock \
            jsonschema \
            yara-python

      - name: Run LLM evaluation gates
        shell: bash
        env:
          SHARED_LLM_EVAL_MODE: replay
        run: |
          set -euo pipefail
          for path in \
            "$SUITE_DIR/001AI-SOC-Agent" \
            "$SUITE_DIR/002AI-Vulnerability-Agent"
          do
            (
              cd "$path"
              python -m pytest tests/test_eval_gate.py \
                --basetemp="$RUNNER_TEMP/pytest-eval-$(basename "$path")" \
                -o addopts= \
                -p no:cacheprovider \
                -q
            )
          done

      - name: Run all test suites
        shell: bash
        run: |
          set -euo pipefail
          projects=(
            "core|$SUITE_DIR/000shared-llm-core"
            "integration|$SUITE_DIR/000shared-integration"
            "001|$SUITE_DIR/001AI-SOC-Agent"
            "002|$SUITE_DIR/002AI-Vulnerability-Agent"
            "003|$SUITE_DIR/003AI Agent安全靶场"
            "004|$SUITE_DIR/004AI-Code-Audit"
            "005|$SUITE_DIR/005AI-Reverse-Agent"
            "006|$SUITE_DIR/006AI-Firmware-Security-Agent"
          )

          for item in "${projects[@]}"; do
            name="${item%%|*}"
            path="${item#*|}"
            echo "::group::pytest $name"
            (
              cd "$path"
              python -m pytest tests \
                --basetemp="$RUNNER_TEMP/pytest-$name" \
                -o addopts= \
                -p no:cacheprovider \
                -q
            )
            echo "::endgroup::"
          done

      - name: Set up Node.js for browser RBAC gate
        if: ${{ hashFiles('suite/web-ui/scripts/run-rbac-e2e.mjs') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: suite/web-ui/package-lock.json

      - name: Install Web dependencies
        if: ${{ hashFiles('suite/web-ui/scripts/run-rbac-e2e.mjs') != '' }}
        working-directory: suite/web-ui
        run: npm ci

      - name: Install Chromium for browser RBAC gate
        if: ${{ hashFiles('suite/web-ui/scripts/run-rbac-e2e.mjs') != '' }}
        working-directory: suite/web-ui
        run: npx playwright install --with-deps chromium

      - name: Run two-round PostgreSQL + Gateway + Web RBAC gate
        if: ${{ hashFiles('suite/web-ui/scripts/run-rbac-e2e.mjs') != '' }}
        working-directory: suite/web-ui
        env:
          CI: "true"
        run: npm run test:e2e:rbac

      - name: Upload browser RBAC diagnostics
        if: ${{ always() && hashFiles('suite/web-ui/test-results/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-rbac-diagnostics
          path: |
            suite/web-ui/test-results
            suite/web-ui/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish suite summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Multi-repository suite"
            echo
            echo "- Core + integration gateway + six product repositories"
            if [ -f "$SUITE_DIR/web-ui/scripts/run-rbac-e2e.mjs" ]; then
              echo "- Real PostgreSQL + Gateway + Web RBAC: two isolated Playwright rounds"
            fi
            echo "- Python 3.12 on Ubuntu"
            echo "- Triggered by: \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

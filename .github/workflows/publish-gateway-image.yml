name: publish-gateway-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Mutable pre-release image tag
        required: true
        default: m3-auth-preprod
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-gateway-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: longyuanai/integration-gateway
  SUITE_DIR: ${{ github.workspace }}/suite

jobs:
  build-and-publish:
    name: Build locked Gateway image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Validate image tag
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]; then
            echo "Invalid OCI image tag: $IMAGE_TAG" >&2
            exit 1
          fi

      - name: Check out shared core
        uses: actions/checkout@v7
        with:
          path: suite/000shared-llm-core
          persist-credentials: false

      - name: Resolve locked image-source refs
        id: suite_refs
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re

          suite = pathlib.Path(os.environ["SUITE_DIR"])
          lock = json.loads((suite / "000shared-llm-core" / "suite-lock.yml").read_text())
          mappings = {
              "integration": "integration_ref",
              "soc": "soc_ref",
              "vulnerability": "vulnerability_ref",
              "lab": "lab_ref",
              "code": "code_ref",
              "reverse": "reverse_ref",
              "firmware": "firmware_ref",
          }
          entries = {entry["key"]: entry for entry in lock["repositories"]}
          errors = []
          resolved = {}
          for key, output_name in mappings.items():
              if key not in entries:
                  errors.append(f"suite lock is missing {key}")
                  continue
              value = entries[key]["commit"]
              if not isinstance(value, str) or not re.fullmatch(r"[0-9a-f]{40}", value):
                  errors.append(f"{key}: ref must be a full lowercase commit SHA")
                  continue
              resolved[output_name] = value
          if errors:
              raise SystemExit("\n".join(errors))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              for output_name, value in resolved.items():
                  output_file.write(f"{output_name}={value}\n")
          print(f"Resolved {len(resolved)} refs from suite-lock.yml")
          PY

      - name: Check out integration gateway
        uses: actions/checkout@v7
        with:
          repository: longyuanai/-000shared-integration
          ref: ${{ steps.suite_refs.outputs.integration_ref }}
          path: suite/000shared-integration
          persist-credentials: false

      - name: Check out 001 SOC Agent
        uses: actions/checkout@v7
        with:
          repository: longyuanai/-001AI-SOC-Agent
          ref: ${{ steps.suite_refs.outputs.soc_ref }}
          path: suite/001AI-SOC-Agent
          persist-credentials: false

      - name: Check out 002 Vulnerability Agent
        uses: actions/checkout@v7
        with:
          repository: longyuanai/002AI-Vulnerability-Agent
          ref: ${{ steps.suite_refs.outputs.vulnerability_ref }}
          path: suite/002AI-Vulnerability-Agent
          persist-credentials: false

      - name: Check out 003 Agent Security Lab
        uses: actions/checkout@v7
        with:
          repository: longyuanai/003AI-Agent-Security-Lab
          ref: ${{ steps.suite_refs.outputs.lab_ref }}
          path: "suite/003AI Agent安全靶场"
          persist-credentials: false

      - name: Check out 004 Code Audit
        uses: actions/checkout@v7
        with:
          repository: longyuanai/004AI-Code-Audit
          ref: ${{ steps.suite_refs.outputs.code_ref }}
          path: suite/004AI-Code-Audit
          persist-credentials: false

      - name: Check out 005 Reverse Agent
        uses: actions/checkout@v7
        with:
          repository: longyuanai/005AI-Reverse-Agent
          ref: ${{ steps.suite_refs.outputs.reverse_ref }}
          path: suite/005AI-Reverse-Agent
          persist-credentials: false

      - name: Check out 006 Firmware Security Agent
        uses: actions/checkout@v7
        with:
          repository: longyuanai/006AI-Firmware-Security-Agent
          ref: ${{ steps.suite_refs.outputs.firmware_ref }}
          path: suite/006AI-Firmware-Security-Agent
          persist-credentials: false

      - name: Verify locked image source set
        shell: bash
        env:
          INTEGRATION_REF: ${{ steps.suite_refs.outputs.integration_ref }}
          SOC_REF: ${{ steps.suite_refs.outputs.soc_ref }}
          VULNERABILITY_REF: ${{ steps.suite_refs.outputs.vulnerability_ref }}
          LAB_REF: ${{ steps.suite_refs.outputs.lab_ref }}
          CODE_REF: ${{ steps.suite_refs.outputs.code_ref }}
          REVERSE_REF: ${{ steps.suite_refs.outputs.reverse_ref }}
          FIRMWARE_REF: ${{ steps.suite_refs.outputs.firmware_ref }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          suite = pathlib.Path(os.environ["SUITE_DIR"])
          lock = json.loads((suite / "000shared-llm-core" / "suite-lock.yml").read_text())
          expected = {
              "core": os.environ["GITHUB_SHA"],
              "integration": os.environ["INTEGRATION_REF"],
              "soc": os.environ["SOC_REF"],
              "vulnerability": os.environ["VULNERABILITY_REF"],
              "lab": os.environ["LAB_REF"],
              "code": os.environ["CODE_REF"],
              "reverse": os.environ["REVERSE_REF"],
              "firmware": os.environ["FIRMWARE_REF"],
          }
          entries = {entry["key"]: entry for entry in lock["repositories"]}
          errors = []
          for key, expected_sha in expected.items():
              entry = entries[key]
              path = suite / entry["path"]
              actual_sha = subprocess.check_output(
                  ["git", "-C", str(path), "rev-parse", "HEAD"], text=True
              ).strip()
              if actual_sha != expected_sha:
                  errors.append(f"{key}: checked out {actual_sha}, expected {expected_sha}")
              locked_sha = expected_sha if key == "core" else entry["commit"]
              if locked_sha != expected_sha:
                  errors.append(f"{key}: suite-lock.yml has {locked_sha}, expected {expected_sha}")
          if errors:
              raise SystemExit("\n".join(errors))
          print(f"Verified {len(expected)} locked image-source repositories")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Verify source image excludes local artifacts
        shell: bash
        run: |
          docker buildx build \
            --target source \
            --load \
            --tag integration-gateway:source-audit \
            --file "$SUITE_DIR/000shared-integration/Dockerfile" \
            "$SUITE_DIR"

          file_violations="$(
            docker run --rm --entrypoint /usr/bin/find integration-gateway:source-audit \
              /suite -type f \( \
                -name '.env' -o -name '.env.*' -o -name '*.pem' -o \
                -name '*.key' -o -name '*.trace' -o -name '*.sqlite3' \
              \) -print
          )"
          directory_violations="$(
            docker run --rm --entrypoint /usr/bin/find integration-gateway:source-audit \
              /suite -type d \( \
                -name '.git' -o -name 'node_modules' -o \
                -name 'playwright-report' -o -name 'test-results' \
              \) -print
          )"

          if [[ -n "${file_violations}${directory_violations}" ]]; then
            printf '%s\n' "$file_violations" "$directory_violations" >&2
            echo "Sensitive or local-only artifacts entered the image context" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,prefix=core-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: suite
          file: suite/000shared-integration/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=integration-gateway
          cache-to: type=gha,mode=max,scope=integration-gateway
          provenance: mode=max
          sbom: true

      - name: Publish image summary
        shell: bash
        run: |
          {
            echo "## IntegrationGateway image"
            echo
            echo "- Image: \`${REGISTRY}/${IMAGE_NAME}:${{ inputs.tag }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Source: eight locked Python repositories"
          } >> "$GITHUB_STEP_SUMMARY"
